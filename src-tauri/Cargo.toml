[package]
name = "quan-ly-task"
version = "0.1.0"
description = "Quản lý Task — app desktop quản lý việc cho manager"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
# Tên lib khác tên bin để tránh xung đột trên Windows
name = "quan_ly_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "fs"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "derive"] }
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
unicode-normalization = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
